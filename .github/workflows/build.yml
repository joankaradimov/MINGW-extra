# Build every package whose current version is not published yet, then publish.
#
# The schedule is what makes this reliable rather than merely automatic: the
# planner compares each PKGBUILD against the live pacman database, so a build
# that crashed or an upload that got lost is retried on the next run without
# anyone having to notice it.
#
# Nothing in this workflow reads the repository over HTTP. The host's bot
# protection answers requests from cloud addresses, which is where GitHub's
# runners are, with a CAPTCHA page instead of the file. So the jobs that hold
# the deploy key -- site, databases, mirror and publish -- copy what is needed
# over SSH, and they are exactly the jobs that run no PKGBUILDs. plan and the
# builds run PKGBUILDs and never see the key.
#
# MSYS packages are built by a job of their own, before the MinGW matrix: a
# MinGW package may depend on one (alpmrpc needs alpmrpcd), and the matrix
# installs what that job produced.
name: build

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Only consider these package directories (space separated). Empty = everything.'
        required: false
        default: ''

# One publisher at a time. Two runs rebuilding the same pacman database
# concurrently would have the loser silently drop the winner's packages. It also
# keeps the databases a run copies at its start current until its publish job.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

env:
  PYTHONUNBUFFERED: 1

jobs:
  # The home page, uploaded on every run like the packages. It takes seconds,
  # and the page on the server can never drift from the one in the repository.
  site:
    name: site
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          port: ${{ secrets.DEPLOY_PORT }}

      - name: Upload the home page
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash ci/publish-site.sh

  databases:
    name: databases
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          port: ${{ secrets.DEPLOY_PORT }}

      - name: Copy the published databases
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash ci/fetch-published.sh databases published

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-databases
          path: published/
          if-no-files-found: error
          retention-days: 1

  plan:
    name: plan
    needs: databases
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      msys: ${{ steps.plan.outputs.msys }}
      mirror: ${{ steps.plan.outputs.mirror }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-databases
          path: published

      # Reading a PKGBUILD means letting bash expand it, which means MSYS2 --
      # even though this job compiles nothing.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      - id: plan
        shell: msys2 {0}
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          PYTHONPATH=ci python -m autobuild plan --published published "${args[@]}"

  # The builds install already-published dependencies from local copies of the
  # repository. Copy them only for the environments that have something to
  # build, plus msys, which any build may depend on -- and only the package
  # files the current databases reference.
  mirror:
    name: mirror ${{ matrix.environment }}
    needs: plan
    if: needs.plan.outputs.mirror != '[]'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.mirror) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-databases
          path: published

      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          port: ${{ secrets.DEPLOY_PORT }}

      - name: Copy the published packages
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: bash ci/fetch-published.sh packages "$ENVIRONMENT" published

      # The environment's directory is absent when nothing is published for it
      # yet; the marker alone still makes a valid, empty copy.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-${{ matrix.environment }}
          path: |
            published/COMPLETE
            published/${{ matrix.environment }}/
          if-no-files-found: error
          retention-days: 1

  build-msys:
    name: msys
    needs: [plan, mirror]
    if: needs.plan.outputs.msys != ''
    runs-on: windows-2022
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-msys
          path: published-msys

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      # No secrets here either: makepkg runs upstream build scripts.
      - name: Build
        shell: msys2 {0}
        env:
          PACKAGES: ${{ needs.plan.outputs.msys }}
        run: |
          PYTHONPATH=ci python -m autobuild build \
            --environment msys \
            --build-root /c/_b \
            --output artifacts \
            --published published-msys \
            $PACKAGES

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-msys
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: ${{ matrix.environment }}
    needs: [plan, mirror, build-msys]
    # Whether the msys job built everything, failed, or had nothing to do: only
    # the packages that need what it did not build fail along with it.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.mirror.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # qt5 and bitcoin will exhaust the default pagefile and fail with errors
      # that look nothing like "out of memory".
      - name: Configure pagefile
        if: matrix.runner != 'windows-11-arm'
        continue-on-error: true
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 4GB
          maximum-size: 16GB
          disk-root: "C:"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-${{ matrix.environment }}
          path: published-own

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: published-msys
          path: published-msys

      # Absent when the msys job built nothing at all; the build then simply
      # has no msys staging repository.
      - name: Download the msys packages built in this run
        if: needs.build-msys.result == 'success' || needs.build-msys.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-msys
          path: prebuilt

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      # No secrets are available to this job on purpose: makepkg runs upstream
      # build scripts. What it needs from the published repository arrives as
      # the mirror jobs' artifacts.
      - name: Build
        shell: msys2 {0}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          PYTHONPATH=ci python -m autobuild build \
            --environment "$ENVIRONMENT" \
            --build-root /c/_b \
            --output artifacts \
            --published published-own \
            --published published-msys \
            --prebuilt prebuilt \
            $PACKAGES

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.environment }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: publish
    needs: [plan, build-msys, build]
    # Deliberately not "the builds succeeded": if clang64 fails and ucrt64
    # succeeds, the ucrt64 packages should still reach users. The next
    # scheduled run picks clang64 back up.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mirror != '[]' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment: publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        run: pacman -Syu --noconfirm --needed rsync openssh git

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: packages-*
          merge-multiple: true

      - uses: ./.github/actions/deploy-ssh
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          port: ${{ secrets.DEPLOY_PORT }}

      - name: Publish
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: ci/publish.sh artifacts
