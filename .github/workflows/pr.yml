# Build the packages a pull request touches, without publishing anything.
#
# This deliberately plans from the diff rather than from the published
# database: a change that fixes build() without bumping pkgrel is still worth
# compiling before it is merged, even though the planner on master would
# correctly consider that version already published.
#
# Nothing here reads the published repository either. That takes the deploy
# key, and no job a pull request can change may hold it. So the planner also
# queues every package from this repository that a changed one depends on, and
# the build compiles those from source first, in the same job.
name: pr

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHONUNBUFFERED: 1

jobs:
  plan:
    name: plan
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the planner needs to diff against the base commit

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      - id: plan
        shell: msys2 {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: PYTHONPATH=ci python -m autobuild plan --changed-since "$BASE_SHA"

  build:
    name: ${{ matrix.environment }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Configure pagefile
        if: matrix.runner != 'windows-11-arm'
        continue-on-error: true
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 4GB
          maximum-size: 16GB
          disk-root: "C:"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      - name: Build
        shell: msys2 {0}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          PYTHONPATH=ci python -m autobuild build \
            --environment "$ENVIRONMENT" \
            --build-root /c/_b \
            --output artifacts \
            $PACKAGES

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.environment }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
