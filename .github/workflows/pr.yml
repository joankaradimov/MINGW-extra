# Build the packages a pull request touches, without publishing anything.
#
# This deliberately plans from the diff rather than from the published
# database: a change that fixes build() without bumping pkgrel is still worth
# compiling before it is merged, even though the planner on master would
# correctly consider that version already published.
#
# Nothing here holds the deploy key: no job a pull request can change may have
# it. The published repository comes from its mirror on ghcr.io instead, read
# anonymously (build.yml's ghcr job keeps it current). A dependency published
# at its PKGBUILD's version is installed from it -- the only way a package that
# needs itself, as asmc does, can build at all. Any other package from this
# repository that a changed one depends on is compiled from source first --
# MSYS ones in a job of their own, ahead of the MinGW matrix, which installs
# what that job built. Without the mirror (before the package is public, say)
# every such dependency is compiled from source.
name: pr

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHONUNBUFFERED: 1

jobs:
  plan:
    name: plan
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      msys: ${{ steps.plan.outputs.msys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the planner needs to diff against the base commit

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      - name: Copy the published databases from ghcr.io
        shell: msys2 {0}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          PYTHONPATH=ci python -m autobuild registry-pull --image "$IMAGE" \
            --dest published --databases-only

      - id: plan
        shell: msys2 {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -f published/COMPLETE ]]; then args+=(--published published); fi
          PYTHONPATH=ci python -m autobuild plan --changed-since "$BASE_SHA" "${args[@]}"

  build-msys:
    name: msys
    needs: plan
    if: needs.plan.outputs.msys != ''
    runs-on: windows-2022
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      - name: Copy the published packages from ghcr.io
        shell: msys2 {0}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          PYTHONPATH=ci python -m autobuild registry-pull --image "$IMAGE" \
            --dest published --environment msys

      - name: Build
        shell: msys2 {0}
        env:
          PACKAGES: ${{ needs.plan.outputs.msys }}
        run: |
          args=()
          if [[ -f published/COMPLETE ]]; then args+=(--published published); fi
          PYTHONPATH=ci python -m autobuild build \
            --environment msys \
            --build-root /c/_b \
            --output artifacts \
            "${args[@]}" \
            $PACKAGES

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-msys
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: ${{ matrix.environment }}
    needs: [plan, build-msys]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Configure pagefile
        if: matrix.runner != 'windows-11-arm'
        continue-on-error: true
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 4GB
          maximum-size: 16GB
          disk-root: "C:"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the msys packages built in this run
        if: needs.build-msys.result == 'success' || needs.build-msys.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-msys
          path: prebuilt

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: true
          install: base-devel git python
          cache: true

      - name: Copy the published packages from ghcr.io
        shell: msys2 {0}
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          PYTHONPATH=ci python -m autobuild registry-pull --image "$IMAGE" \
            --dest published --environment "$ENVIRONMENT" --environment msys

      - name: Build
        shell: msys2 {0}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          args=()
          if [[ -f published/COMPLETE ]]; then args+=(--published published); fi
          PYTHONPATH=ci python -m autobuild build \
            --environment "$ENVIRONMENT" \
            --build-root /c/_b \
            --output artifacts \
            --prebuilt prebuilt \
            "${args[@]}" \
            $PACKAGES

      - name: Upload packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.environment }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
