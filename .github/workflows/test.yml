# The planner's logic is testable without a Windows runner or MSYS2, so test it
# on every change. A wrong topological sort does not crash; it just builds sord
# before serd and fails on a runner twenty minutes later.
name: test

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: PYTHONPATH=ci python3 -m unittest discover -s ci -v
